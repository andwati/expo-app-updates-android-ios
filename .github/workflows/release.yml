name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const expected = "v" + require("./package.json").version;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error("Release tag must match " + expected);
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## ${RELEASE_TAG#v}" '
            $0 == heading { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > "$notes"

          if grep -q '[^[:space:]]' "$notes"; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
