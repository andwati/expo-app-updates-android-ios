plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.andwati.appupdatesandroid'
version = '0.1.2'

android {
  namespace "com.andwati.appupdatesandroid"
  defaultConfig {
    versionCode 3
    versionName "0.1.2"
  }
  lint {
    abortOnError = true
    warningsAsErrors = true
  }
}

dependencies {
  implementation 'com.google.android.play:app-update:2.1.0'
  implementation 'androidx.activity:activity:1.13.0'
}
